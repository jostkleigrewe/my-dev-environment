#######################################################################
# STOCK
#######################################################################
name: ${DOCKER_PROJECT_NAME}

services:

  #######################################################################
  # OLLAMA
  #######################################################################
  ollama:
    image: ollama/ollama:${DOCKER_OLLAMA_VERSION?latest}
    restart: unless-stopped
    container_name: ${DOCKER_PROJECT_NAME}-ollama
    expose:
      - 11434
    ports:
      - ${DOCKER_OLLAMA_PORT:-11434}:11434
    volumes:
      - type: volume
        source: ollama-volume
        target: /root/.ollama
      - type: bind
        source: ./data/ollama/install-models.sh
        target: /usr/local/bin/install-models.sh
#    environment:
#      - DOCKER_OLLAMA_AUTO_PULL=${DOCKER_OLLAMA_AUTO_PULL}
#    entrypoint: ["/usr/local/bin/install-models.sh"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.docker.localhost`)"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"
    networks:
      euripnet:
        aliases:
          - 'ollama.docker.localhost'


  #######################################################################
  # OLLAMA-WEBUI
  #######################################################################
  ollama-webui:
    image: ghcr.io/ollama-webui/ollama-webui:main
    restart: unless-stopped
    container_name: ${DOCKER_PROJECT_NAME}-ollama-webui
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
    volumes:
      - type: volume
        source: ollama-webui-volume
        target: /app/backend/data
    expose:
      - 11434
    ports:
      - ${DOCKER_OLLAMA_WEBUI_PORT:-3010}:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama-webui.rule=Host(`ollama-webui.docker.localhost`)"
      - "traefik.http.services.ollama-webui.loadbalancer.server.port=8080"
    networks:
      euripnet:
        aliases:
          - 'ollama-webui.docker.localhost'


  #######################################################################
  # QDRANT
  #######################################################################
  qdrant:
    image: qdrant/qdrant:${DOCKER_QDRANT_VERSION?latest}
    restart: unless-stopped
    container_name: ${DOCKER_PROJECT_NAME}-qdrant
    expose:
      - 6333
    ports:
      - ${DOCKER_QDRANT_PORT:-6333}:6333
    volumes:
      - type: volume
        source: qdrant-volume
        target: /qdrant/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.docker.localhost`)"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"
    networks:
      euripnet:
        aliases:
          - 'qdrant.docker.localhost'


  #######################################################################
  # ANYTHING LLM
  #######################################################################
  anythingllm:
    image:  mintplexlabs/anythingllm:${DOCKER_ANYTHINGLLM_VERSION?latest}
    restart: unless-stopped
    container_name: ${DOCKER_PROJECT_NAME}-anythingllm
    expose:
      - 3001
    ports:
      - ${DOCKER_ANYTHINGLLM_PORT:-3001}:3001
    environment:
      - STORAGE_DIR=/app/server/storage
#      - VECTOR_DB=qdrant
#      - QDRANT_HOST=http://qdrant:6333
#      - OLLAMA_BASE_PATH=http://ollama:11434
#      - OLLAMA_MODEL=mistral:instruct-q4_0
#      - SERVER_PORT=3001
#      - UID='1000'
#      - GID='1000'
#      - STORAGE_DIR=/app/server/storage
#      - LLM_PROVIDER=ollama
#      - OLLAMA_BASE_PATH=http://ollama-server:11434
#      - OLLAMA_MODEL_PREF='phi3'
#      - OLLAMA_MODEL_TOKEN_LIMIT=4096
#      - EMBEDDING_ENGINE=ollama
#      - EMBEDDING_BASE_PATH=http://ollama-server:11434
#      - EMBEDDING_MODEL_PREF=nomic-embed-text:latest
#      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=8192
#      - VECTOR_DB=lancedb
#      - WHISPER_PROVIDER=local
#      - TTS_PROVIDER=native
#      - PASSWORDMINCHAR=8
    depends_on:
      - qdrant
      - ollama
    cap_add:
      - SYS_ADMIN
    volumes:
      - type: volume
        source: anythingllm-volume
        target: /app/server/storage
      - type: bind
        source: ./data/anythingllm/.env
        target: /app/server/.env
#- ./image/mysql/initd:/docker-entrypoint-initdb.d:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anythingllm.rule=Host(`anythingllm.docker.localhost`)"
      - "traefik.http.services.anythingllm.loadbalancer.server.port=3001"
    networks:
      euripnet:
        aliases:
          - 'anythingllm.docker.localhost'


  #######################################################################
  # N8N
  #######################################################################
  n8n:
    image: n8nio/n8n:${DOCKER_N8N_VERSION:-latest}
    container_name: ${DOCKER_PROJECT_NAME}-n8n
    restart: unless-stopped
    expose:
      - 5678
    ports:
      - ${DOCKER_N8N_PORT:-5678}:5678
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${DOCKER_N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${DOCKER_N8N_PASSWORD:-changeme}
      - N8N_HOST=n8n.docker.localhost
      - N8N_PORT=5678
      - N8N_SECURE_COOKIE=false
    volumes:
      - type: volume
        source: n8n-volume
        target: /home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.docker.localhost`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    networks:
      euripnet:
        aliases:
          - 'n8n.docker.localhost'


#######################################################################
# NETWORKS
#######################################################################
networks:
  euripnet:
    external: true

#######################################################################
# VOLUMES
#######################################################################
volumes:
  ollama-volume:
    name: ${DOCKER_OLLAMA_VOLUME}
  ollama-webui-volume:
    name: ${DOCKER_OLLAMA_WEBUI_VOLUME}
  qdrant-volume:
    name: ${DOCKER_QDRANT_VOLUME}
  anythingllm-volume:
    name: ${DOCKER_ANYTHINGLLM_VOLUME}
  n8n-volume:
    name: ${DOCKER_N8N_VOLUME}
